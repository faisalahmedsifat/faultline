services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      target: dev
    command: ["sh", "-lc", "bun run dev"]
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: dev
    command: ["sh", "-lc", "bun run dev"]
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "4000:4000"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
      target: dev
    command: ["sh", "-lc", "bun run dev"]
    volumes:
      - .:/app
      - /app/node_modules

